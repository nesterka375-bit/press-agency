{% extends "base.html" %}

{% block title %}
  <title>Delete Article - Press Agency</title>
{% endblock %}

{% block maincontent %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card border-danger p-4">
        <h3 class="text-danger">Delete Article?</h3>
        <p class="mt-3">Are you sure you want to delete <strong>"{{ object.title }}"</strong>?</p>
        <form method="post" class="mt-4">
          {% csrf_token %}
          <a href="javascript:history.back()" class="btn btn-secondary me-2">Cancel</a>
          <button type="submit" class="btn btn-danger">Confirm Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
